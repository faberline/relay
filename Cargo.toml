# SPEC-MANAGED: tech-design/logic/core-durable-log-single-multi-broadcast-delivery-model.md#changes
# HANDWRITE-BEGIN gap="missing-generator:config:7d099e74" tracker="pending-tracker" reason="Virtual workspace manifest for the relay bounded-context crates (aw docs/standards/saas-service.md)."
[workspace]
resolver = "2"
# One crate per relay bounded context plus the shared kernel and the `relay`
# assembly crate (see ddd.toml). Generic service infrastructure comes from
# faberline/core, never from here.
members = ["crates/*"]

[workspace.package]
# relay releases independently (relay@<version> tags). Every member inherits
# this version; the release scripts and workflows read the first column-0
# `version = "` line of this file.
version = "0.4.13"
edition = "2021"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
license = "MIT"
repository = "https://github.com/faberline/relay"

[workspace.dependencies]
# relay crates.
relay = { path = "crates/relay" }
relay-access = { path = "crates/relay-access" }
relay-broker = { path = "crates/relay-broker" }
relay-operator = { path = "crates/relay-operator" }
relay-queue = { path = "crates/relay-queue" }
relay-replication = { path = "crates/relay-replication" }
relay-shared-kernel = { path = "crates/relay-shared-kernel" }
relay-storage = { path = "crates/relay-storage" }

# faberline/core building blocks.
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.14", version = "0.5" }
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
raft-core = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

# Third-party. kube-rs versions mirror the other faberline users so the
# lockfile stays single-versioned.
anyhow = "1.0"
async-nats = "0.38"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive", "string"] }
crc32fast = "1.4"
criterion = "0.5"
futures = "0.3"
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
lapin = "2.5"
rcgen = "0.13"
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
rustls = "0.23"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = "4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# A module is a file `src/<name>.rs`, never `src/<name>/mod.rs`.
[workspace.lints.clippy]
mod_module_files = "deny"
# HANDWRITE-END
