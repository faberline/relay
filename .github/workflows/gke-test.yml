# relay on Faberline's shared GKE test cluster (faberline-test).
#
# faberline/aw's reusable gke-test workflow deploys k8s/overlays/gke-test
# (three raft voters) with the image under test on pool-relay-server, runs one
# suite's test Job on pool-relay-client, uploads the evidence artifact
# gke-test-evidence-<run_id>-<attempt>-<suite>, and tears the namespace down.
# The test Job runs the Rust suite crates/relay/tests/it/e2e/<suite>.rs from the
# relay-test-client image; every check, image identity included, is in Rust
# (aw docs/standards/rust-tests.md).
#
# Suites (aw docs/standards/test-cluster.md "Test suites"), one call each, one
# at a time, each on a fresh deploy:
#   raft_failover  k8s/gke-test-job/raft_failover  replaces scripts/kind-failover-smoke.sh
# A pull request runs all of them; a dispatch can pick one.
#
# GKE runs linux/amd64 only. aw owns the cluster, both pools, and the
# gke-test-relay service account (infra/gke-test/pools.yaml in faberline/aw);
# nothing here creates cloud resources.
#
# Images, both from the same commit:
#   ghcr.io/faberline/relay:sha-<git12>              relay-test-image.yml (server)
#   ghcr.io/faberline/relay-test-client:sha-<git12>  the test-client job below
# Both are pinned by digest before the run.
name: gke-test

on:
  pull_request:
    paths:
      - ".github/workflows/gke-test.yml"
      - ".github/workflows/relay-test-image.yml"
      - "Dockerfile"
      - "Dockerfile.test"
      - "Cargo.toml"
      - "Cargo.lock"
      - "k8s/base/**"
      - "k8s/overlays/gke-test/**"
      - "k8s/gke-test-job/**"
      - "crates/**"
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run; all runs every suite, one at a time.
        type: choice
        options: [all, raft_failover]
        default: all

permissions:
  contents: read

jobs:
  image:
    name: build server image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/relay-test-image.yml

  test-client:
    name: build test-client image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: relay-test-client-x86_64-unknown-linux-musl

      # The suites only talk HTTP and run kubectl, so the test binary needs no
      # crate feature; musl makes it fit the static base image.
      - name: Build the test binary
        shell: bash
        run: |
          set -euo pipefail
          exe="$(cargo test --release --locked --target x86_64-unknown-linux-musl \
              -p relay --test it --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "it") | .executable')"
          [[ -n "$exe" && -x "$exe" ]] || { echo "::error::no test binary for it"; exit 1; }
          mkdir -p dist/linux/amd64
          cp "$exe" dist/linux/amd64/relay-it

      - name: Resolve image tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          git12="$(git rev-parse HEAD | cut -c1-12)"
          echo "tag=ghcr.io/${{ github.repository_owner }}/relay-test-client:sha-${git12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the test-client image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test-client
          platforms: linux/amd64
          push: true
          # NEVER add `latest` or a semver tag here — dev/test line only.
          tags: ${{ steps.ver.outputs.tag }}

      - name: Record pushed digest
        id: digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest: $DIGEST"; exit 1; }
          echo "image=ghcr.io/${{ github.repository_owner }}/relay-test-client@${DIGEST}" >> "$GITHUB_OUTPUT"

  resolve:
    name: resolve image identity
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.identity.outputs.image }}
      test-env: ${{ steps.identity.outputs.test_env }}
      suites: ${{ steps.identity.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pin the image and its expected identity
        id: identity
        shell: bash
        env:
          RAW_IMAGE: ${{ needs.image.outputs.image }}
          # A pull request has no inputs, so it runs all suites.
          INPUT_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*" >&2; exit 1; }
          [[ "$RAW_IMAGE" =~ ^ghcr\.io/faberline/relay:sha-([0-9a-f]{12})@(sha256:[0-9a-f]{64})$ ]] \
            || die "image must be ghcr.io/faberline/relay:sha-<git12>@sha256:<64 hex>, got: $RAW_IMAGE"
          git_sha="${BASH_REMATCH[1]:0:8}"
          root_digest="${BASH_REMATCH[2]}"
          image="ghcr.io/faberline/relay@${root_digest}"

          version="$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || die "invalid version: $version"

          # relay-test-image.yml pushes one linux/amd64 image. buildx may still
          # wrap it in an index (attestations); then the amd64 child is what
          # the node pulls. A plain manifest runs as the root digest itself.
          raw="$(docker buildx imagetools inspect --raw "$image")"
          if jq -e '.manifests? | type == "array"' <<<"$raw" >/dev/null; then
            runtime_digest="$(jq -r '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] |
              if length == 1 then .[0] else empty end' <<<"$raw")"
          else
            runtime_digest="$root_digest"
          fi
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || die "no single linux/amd64 digest for $image"

          case "$INPUT_SUITE" in
            all) suites='["raft_failover"]' ;;
            raft_failover) suites="[\"${INPUT_SUITE}\"]" ;;
            *) die "suite must be all or raft_failover, got: $INPUT_SUITE" ;;
          esac

          {
            echo "image=${image}"
            echo "suites=${suites}"
            echo "test_env<<EOF"
            echo "E2E_EXPECTED_VERSION=${version}"
            echo "E2E_EXPECTED_GIT_SHA=${git_sha}"
            echo "E2E_EXPECTED_IMAGE=${image}"
            echo "E2E_EXPECTED_RUNTIME_DIGEST=${runtime_digest}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### relay gke-test identity"
            echo
            echo '```text'
            echo "image:          ${image}"
            echo "version:        ${version}"
            echo "git_sha:        ${git_sha}"
            echo "runtime_digest: ${runtime_digest}"
            echo "suites:         ${suites}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gke-test:
    name: GKE e2e (${{ matrix.suite }})
    needs: [resolve, test-client]
    # One call at a time: the repository's concurrency group in aw keeps only
    # one waiting run. fail-fast off runs the other suites when one fails.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.resolve.outputs.suites) }}
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: faberline/aw/.github/workflows/gke-test.yml@main
    with:
      image: ${{ needs.resolve.outputs.image }}
      image-name: ghcr.io/faberline/relay
      namespace: relay
      test-job: k8s/gke-test-job/${{ matrix.suite }}
      test-image: ${{ needs.test-client.outputs.image }}
      test-image-name: relay-test-client
      test-env: ${{ needs.resolve.outputs.test-env }}
      evidence-suffix: ${{ matrix.suite }}
