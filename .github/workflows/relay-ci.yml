# Pull-request and main CI: the gates relay-release-candidate.yml runs before
# it builds a candidate (`cargo test --locked -p relay` and the release
# contract), plus fmt, clippy, the feature-gated tests, and the release
# scripts' self-tests, so a landed commit is already one the release gates
# accept. No cluster, no image, no network beyond crates and git deps.
name: relay-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: fmt, clippy, tests, release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: relay-ci
      - name: Run Relay gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          # The release gate builds default features; --all-features adds the
          # operator and backup tests it does not reach.
          cargo test --locked --workspace
          cargo test --locked --workspace --all-features
      - name: Release contract
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.13 --no-project scripts/release/verify-release-contract.py --app relay
          uv run --python 3.13 --no-project scripts/release/verify-release-contract.py --self-test
          uv run --python 3.13 --no-project scripts/release/make-gke-release-receipt.py --self-test
      - name: Verify restart, failover, and soak wrapper self-test
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-restart-failover-soak.sh --self-test
      - name: Verify restart, failover, and live soak gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-restart-failover-soak.sh target/restart-failover-soak-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: restart-failover-soak-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/restart-failover-soak-evidence/
          if-no-files-found: warn
