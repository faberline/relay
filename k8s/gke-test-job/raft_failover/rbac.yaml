# What the suite reads and does in the run's namespace, and nothing
# cluster-wide: it reads the relay pods, runs `relay --version` in relay-0,
# and deletes the leader pod for the failover.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-e2e
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relay-e2e
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relay-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: relay-e2e
subjects:
  - kind: ServiceAccount
    name: relay-e2e
    namespace: relay
