version = 1
name = "relay-ec"
default_runner = "meter-perf"

[workspace]
base = "."
workdir = "."
keep = "always"

[[setup]]
id = "build-aw-tools"
cmd = ["sh", "-c", "command -v meter >/dev/null || { echo \"install the gate tool: cargo install --locked --git https://github.com/faberline/meter meter-cli\" >&2; exit 1; }"]

[[setup]]
id = "build-relay-security-ec-tests"
cmd = [
  "cargo",
  "test",
  "-p",
  "relay",
  "--test",
  "auth",
  "--test",
  "service_admission",
  "--test",
  "raft_peer_mtls",
  "--test",
  "direct_k8s_assets",
  "--no-run",
]

[[setup]]
id = "build-service-auth-security-ec-tests"
cmd = ["cargo", "test", "-p", "service-auth", "--lib", "--no-run"]

[[setup]]
id = "build-relay-measured-performance-gate"
cmd = [
  "cargo",
  "test",
  "--release",
  "-p",
  "relay",
  "--test",
  "measured_performance",
  "--no-run",
]

[[runners]]
id = "meter-perf"
cmd = ["bash", "scripts/ec-evidence.sh", "performance-efficiency"]
timeout_s = 600

[[runners]]
id = "security-evidence"
cmd = ["bash", "scripts/ec-evidence.sh", "security-evidence"]
timeout_s = 600
