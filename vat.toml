version = 1
name = "relay-ec"
default_runner = "meter-perf"

[workspace]
base = "."
workdir = "."
keep = "always"

[env]
PATH = "/Users/chrischeng/.rustup/toolchains/stable-aarch64-apple-darwin/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Users/chrischeng/.cargo/bin"

[[setup]]
id = "build-aw-tools"
cmd = ["sh", "-c", "command -v meter >/dev/null && command -v guard >/dev/null || { echo \"install the gate tools: cargo install --locked --git https://github.com/faberline/meter meter-cli; cargo install --locked --git https://github.com/faberline/guard guard-cli\" >&2; exit 1; }"]

[[setup]]
id = "build-relay-security-ec-tests"
cmd = [
  "cargo",
  "test",
  "-p",
  "relay",
  "--test",
  "it",
  "--no-run",
]

[[setup]]
id = "build-relay-measured-performance-gate"
cmd = [
  "cargo",
  "test",
  "--release",
  "-p",
  "relay",
  "--test",
  "it",
  "--no-run",
]

[[runners]]
id = "meter-perf"
cmd = ["bash", "scripts/ec-evidence.sh", "performance-efficiency"]
timeout_s = 600

[[runners]]
id = "guard-security"
cmd = [
  "guard",
  "scan",
  ".",
  "--profile",
  "security-lint",
  "--compact",
  "--no-persist",
  "--meter-command",
  "bash scripts/ec-evidence.sh security-guard",
]
timeout_s = 600
